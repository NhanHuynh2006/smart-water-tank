<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; }
    a { color: #b45309; } a:hover { color: #7c3f06; }
    .t { font-family: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif; }
    .m { font-family: "IBM Plex Mono", ui-monospace, "Courier New", monospace; }
  </style>
</helmet>

<div style="width: 900px; height: 820px; background: #faf9f7; overflow: hidden">
  <svg width="900" height="820" viewBox="0 0 900 820" xmlns="http://www.w3.org/2000/svg">

    <text x="36" y="44" class="t" font-size="24" font-weight="700" fill="#16150f">Hai mạch chia áp, và hai chỗ KHÔNG được chia áp</text>
    <text x="36" y="67" class="t" font-size="13" fill="#6b6558">V_ra = V_vào × R2 ⁄ (R1 + R2) · R1 từ phía tín hiệu, R2 xuống đất, điểm giữa vào ESP32</text>
    <line x1="36" y1="84" x2="864" y2="84" stroke="#16150f" stroke-width="2"></line>

    <!-- ===== chia ap ECHO ===== -->
    <g>
      <rect x="36" y="104" width="392" height="300" rx="8" fill="#ffffff" stroke="#16150f" stroke-width="1.8"></rect>
      <rect x="36" y="104" width="392" height="40" rx="8" fill="#f4f1ea"></rect>
      <rect x="36" y="134" width="392" height="10" fill="#f4f1ea"></rect>
      <text x="56" y="131" class="t" font-size="15" font-weight="700" fill="#16150f">1 · ECHO của HC-SR04 → GPIO 18</text>

      <text x="80" y="170" class="m" font-size="12.5" font-weight="600" fill="#2e8b3d">ECHO (5,0 V, đẩy kéo)</text>
      <line x1="120" y1="180" x2="120" y2="206" stroke="#2e8b3d" stroke-width="2.6"></line>
      <rect x="104" y="206" width="32" height="62" rx="3" fill="#fff8e8" stroke="#16150f" stroke-width="1.8"></rect>
      <text x="152" y="233" class="m" font-size="13" font-weight="600" fill="#16150f">R1</text>
      <text x="152" y="251" class="m" font-size="13" fill="#16150f">10 kΩ</text>
      <line x1="120" y1="268" x2="120" y2="294" stroke="#16150f" stroke-width="2.6"></line>

      <circle cx="120" cy="294" r="5.5" fill="#2563c9"></circle>
      <line x1="120" y1="294" x2="266" y2="294" stroke="#2563c9" stroke-width="2.8"></line>
      <text x="274" y="290" class="m" font-size="12.5" font-weight="700" fill="#2563c9">→ GPIO 18</text>
      <text x="274" y="308" class="m" font-size="12.5" font-weight="600" fill="#2563c9">3,33 V</text>

      <line x1="120" y1="294" x2="120" y2="314" stroke="#16150f" stroke-width="2.6"></line>
      <rect x="104" y="314" width="32" height="62" rx="3" fill="#fff8e8" stroke="#16150f" stroke-width="1.8"></rect>
      <text x="152" y="341" class="m" font-size="13" font-weight="600" fill="#16150f">R2</text>
      <text x="152" y="359" class="m" font-size="13" fill="#16150f">20 kΩ</text>
      <line x1="120" y1="376" x2="120" y2="384" stroke="#16150f" stroke-width="2.6"></line>
      <line x1="104" y1="384" x2="136" y2="384" stroke="#16150f" stroke-width="3"></line>
      <line x1="110" y1="389" x2="130" y2="389" stroke="#16150f" stroke-width="2.5"></line>
      <line x1="115" y1="394" x2="125" y2="394" stroke="#16150f" stroke-width="2"></line>
      <text x="152" y="390" class="m" font-size="12" fill="#6b6558">GND</text>

      <text x="274" y="356" class="m" font-size="12" fill="#6b6558">5,0 × 20</text>
      <line x1="274" y1="364" x2="342" y2="364" stroke="#6b6558" stroke-width="1.2"></line>
      <text x="274" y="382" class="m" font-size="12" fill="#6b6558">10 + 20</text>
      <text x="350" y="370" class="m" font-size="13" font-weight="700" fill="#16150f">= 3,33 V</text>
    </g>

    <!-- ===== chia ap ACS712 ===== -->
    <g>
      <rect x="472" y="104" width="392" height="300" rx="8" fill="#ffffff" stroke="#16150f" stroke-width="1.8"></rect>
      <rect x="472" y="104" width="392" height="40" rx="8" fill="#f4f1ea"></rect>
      <rect x="472" y="134" width="392" height="10" fill="#f4f1ea"></rect>
      <text x="492" y="131" class="t" font-size="15" font-weight="700" fill="#16150f">2 · OUT của ACS712 → GPIO 34</text>

      <text x="516" y="170" class="m" font-size="12.5" font-weight="600" fill="#2e8b3d">OUT (2,5 V khi nghỉ)</text>
      <line x1="556" y1="180" x2="556" y2="206" stroke="#2e8b3d" stroke-width="2.6"></line>
      <rect x="540" y="206" width="32" height="62" rx="3" fill="#fff8e8" stroke="#16150f" stroke-width="1.8"></rect>
      <text x="588" y="233" class="m" font-size="13" font-weight="600" fill="#16150f">R5</text>
      <text x="588" y="251" class="m" font-size="13" fill="#16150f">10 kΩ</text>
      <line x1="556" y1="268" x2="556" y2="294" stroke="#16150f" stroke-width="2.6"></line>

      <circle cx="556" cy="294" r="5.5" fill="#2563c9"></circle>
      <line x1="556" y1="294" x2="702" y2="294" stroke="#2563c9" stroke-width="2.8"></line>
      <text x="710" y="290" class="m" font-size="12.5" font-weight="700" fill="#2563c9">→ GPIO 34</text>
      <text x="710" y="308" class="m" font-size="12.5" font-weight="600" fill="#2563c9">1,25 V</text>

      <line x1="556" y1="294" x2="556" y2="314" stroke="#16150f" stroke-width="2.6"></line>
      <rect x="540" y="314" width="32" height="62" rx="3" fill="#fff8e8" stroke="#16150f" stroke-width="1.8"></rect>
      <text x="588" y="341" class="m" font-size="13" font-weight="600" fill="#16150f">R6</text>
      <text x="588" y="359" class="m" font-size="13" fill="#16150f">10 kΩ</text>
      <line x1="556" y1="376" x2="556" y2="384" stroke="#16150f" stroke-width="2.6"></line>
      <line x1="540" y1="384" x2="572" y2="384" stroke="#16150f" stroke-width="3"></line>
      <line x1="546" y1="389" x2="566" y2="389" stroke="#16150f" stroke-width="2.5"></line>
      <line x1="551" y1="394" x2="561" y2="394" stroke="#16150f" stroke-width="2"></line>
      <text x="588" y="390" class="m" font-size="12" fill="#6b6558">GND</text>

      <text x="710" y="344" class="t" font-size="11.5" fill="#6b6558">tỉ số 1∶1 đưa điểm nghỉ</text>
      <text x="710" y="362" class="t" font-size="11.5" fill="#6b6558">về giữa dải đo, tín hiệu</text>
      <text x="710" y="380" class="t" font-size="11.5" fill="#6b6558">còn chỗ đi cả hai chiều</text>
    </g>

    <!-- ===== HAI CAM BIEN LUU LUONG: KHONG CHIA AP ===== -->
    <rect x="36" y="428" width="828" height="290" rx="8" fill="#fdecec" stroke="#d92b2b" stroke-width="2.4"></rect>
    <rect x="36" y="428" width="828" height="42" rx="8" fill="#d92b2b"></rect>
    <rect x="36" y="460" width="828" height="10" fill="#d92b2b"></rect>
    <text x="56" y="456" class="t" font-size="15.5" font-weight="700" fill="#ffffff">3 và 4 · HAI cảm biến lưu lượng → GPIO 4 và GPIO 19 · NỐI THẲNG, KHÔNG CHIA ÁP</text>

    <!-- cach dung -->
    <rect x="56" y="486" width="384" height="118" rx="6" fill="#ffffff" stroke="#2e8b3d" stroke-width="2"></rect>
    <text x="72" y="510" class="t" font-size="13.5" font-weight="700" fill="#1f6b2e">ĐÚNG · cực thu hở, kéo lên nội bộ</text>
    <text x="72" y="534" class="m" font-size="12.5" fill="#16150f">dây đỏ   → 5 V</text>
    <text x="72" y="553" class="m" font-size="12.5" fill="#16150f">dây đen  → GND điểm sao</text>
    <text x="72" y="572" class="m" font-size="12.5" font-weight="700" fill="#1f6b2e">dây vàng → THẲNG vào GPIO</text>
    <text x="72" y="593" class="m" font-size="11.5" fill="#6b6558">FLOW_PIN_PULLUP = 1 · nghỉ ở 3,3 V</text>

    <!-- cach sai -->
    <rect x="460" y="486" width="384" height="118" rx="6" fill="#ffffff" stroke="#d92b2b" stroke-width="2"></rect>
    <text x="476" y="510" class="t" font-size="13.5" font-weight="700" fill="#a01b1b">SAI · vừa kéo lên nội bộ vừa chia áp</text>
    <text x="476" y="534" class="m" font-size="12" fill="#7d1616">kéo lên ≈ 45 kΩ ∥ 20 kΩ xuống đất</text>
    <text x="476" y="554" class="m" font-size="13" font-weight="700" fill="#a01b1b">3,3 × 20 ⁄ (45+20) = 1,02 V</text>
    <text x="476" y="574" class="m" font-size="12" fill="#7d1616">ngưỡng: thấp &lt; 0,825 · cao &gt; 2,475</text>
    <text x="476" y="594" class="m" font-size="12" font-weight="700" fill="#a01b1b">→ VÙNG KHÔNG XÁC ĐỊNH</text>

    <!-- bang do kiem -->
    <rect x="56" y="616" width="788" height="86" rx="6" fill="#ffffff" stroke="#e8b4b4" stroke-width="1.5"></rect>
    <text x="72" y="638" class="t" font-size="13" font-weight="700" fill="#a01b1b">Đo bắt buộc trước khi cắm dây vàng vào ESP32</text>
    <text x="72" y="658" class="t" font-size="12" fill="#3a3529">Cấp 5 V cho cảm biến, chưa nối vào ESP32, đo điện áp giữa dây vàng và GND:</text>
    <circle cx="80" cy="676" r="4" fill="#d92b2b"></circle>
    <text x="94" y="681" class="t" font-size="12" fill="#3a3529">đo được <tspan class="m" font-weight="700">~5 V</tspan> → mô đun có điện trở kéo lên sẵn, PHẢI dùng chia áp 10k/20k và đặt cờ = 0</text>
    <circle cx="80" cy="694" r="4" fill="#2e8b3d"></circle>
    <text x="94" y="699" class="t" font-size="12" fill="#3a3529">đo được <tspan class="m" font-weight="700">~0 V</tspan> hoặc trôi nổi → cực thu hở thuần, nối thẳng, giữ cờ = 1</text>

    <!-- bang chung -->
    <rect x="36" y="734" width="828" height="64" rx="6" fill="#f4f1ea" stroke="#cfc8ba" stroke-width="1.5"></rect>
    <text x="56" y="756" class="t" font-size="13" font-weight="700" fill="#16150f">Vì sao đổi: số đo thật trên phần cứng</text>
    <text x="56" y="776" class="t" font-size="12" fill="#3a3529">Bản vẽ trước bắt hai cảm biến qua chia áp. Kết quả đo được: <tspan class="m" font-weight="700">3849 tới 5147 xung/giây</tspan> khi bơm chưa hề chạy,</text>
    <text x="56" y="792" class="t" font-size="12" fill="#3a3529">tức hơn 500 L/phút. YF-S401 ở lưu lượng tối đa chỉ cho 6 × 98 = <tspan class="m" font-weight="700">588 xung/giây</tspan>. Toàn bộ là nhiễu.</text>
  </svg>
</div>
</x-dc>
</body>
</html>
