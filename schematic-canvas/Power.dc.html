<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; }
    a { color: #b45309; } a:hover { color: #7c3f06; }
    .t { font-family: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif; }
    .m { font-family: "IBM Plex Mono", ui-monospace, "Courier New", monospace; }
  </style>
</helmet>

<div style="width: 900px; height: 820px; background: #faf9f7; overflow: hidden">
  <svg width="900" height="820" viewBox="0 0 900 820" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="ar2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
        <path d="M0,0 L9,4.5 L0,9 z" fill="context-stroke"></path>
      </marker>
    </defs>

    <text x="36" y="44" class="t" font-size="24" font-weight="700" fill="#16150f">Nguồn phân phối hình sao</text>
    <text x="36" y="67" class="t" font-size="13" fill="#6b6558">Bơm 5 V dùng chung đường với ESP32, nên cách phân phối quyết định độ ổn định</text>
    <line x1="36" y1="84" x2="864" y2="84" stroke="#16150f" stroke-width="2"></line>

    <!-- nguon 12V -->
    <rect x="36" y="110" width="190" height="70" rx="6" fill="#ffffff" stroke="#16150f" stroke-width="1.8"></rect>
    <text x="52" y="136" class="t" font-size="14.5" font-weight="600" fill="#16150f">PS1 · Nguồn tổ ong</text>
    <text x="52" y="156" class="m" font-size="13" fill="#16150f">12 V ⁄ ≥ 3 A</text>
    <text x="52" y="172" class="t" font-size="11" fill="#6b6558">nguồn gốc duy nhất</text>

    <!-- cau chi -->
    <line x1="226" y1="145" x2="286" y2="145" stroke="#d4a017" stroke-width="4"></line>
    <rect x="286" y="118" width="120" height="54" rx="5" fill="#fff8e8" stroke="#c9962a" stroke-width="1.8"></rect>
    <text x="346" y="141" class="t" font-size="13" font-weight="600" fill="#8a6412" text-anchor="middle">F1 cầu chì</text>
    <text x="346" y="159" class="m" font-size="13" fill="#8a6412" text-anchor="middle">2 A</text>

    <!-- buck -->
    <line x1="406" y1="145" x2="466" y2="145" stroke="#d4a017" stroke-width="4"></line>
    <rect x="466" y="110" width="200" height="70" rx="6" fill="#ffffff" stroke="#16150f" stroke-width="1.8"></rect>
    <text x="482" y="136" class="t" font-size="14.5" font-weight="600" fill="#16150f">U2 · Mạch buck</text>
    <text x="482" y="156" class="m" font-size="13" fill="#16150f">12 V → 5 V ⁄ 5 A</text>
    <text x="482" y="172" class="t" font-size="11" fill="#6b6558">hạ áp duy nhất</text>

    <!-- diem sao -->
    <line x1="566" y1="180" x2="566" y2="214" stroke="#d92b2b" stroke-width="4"></line>
    <rect x="196" y="214" width="520" height="62" rx="8" fill="#16150f"></rect>
    <text x="456" y="240" class="t" font-size="15.5" font-weight="700" fill="#ffffff" text-anchor="middle">CỌC NGÕ RA 5 V CỦA U2 — ĐIỂM SAO</text>
    <text x="456" y="262" class="t" font-size="11.5" fill="#b9b2a2" text-anchor="middle">mọi nhánh bắt đầu từ đây, không nhánh nào mắc nối tiếp qua nhánh khác</text>

    <!-- 5 nhanh -->
    <line x1="456" y1="276" x2="456" y2="300" stroke="#d92b2b" stroke-width="3"></line>
    <line x1="106" y1="300" x2="806" y2="300" stroke="#d92b2b" stroke-width="3"></line>

    <!-- nhanh A -->
    <line x1="106" y1="300" x2="106" y2="334" stroke="#d92b2b" stroke-width="3" marker-end="url(#ar2)"></line>
    <rect x="36" y="340" width="140" height="112" rx="6" fill="#ffffff" stroke="#16150f" stroke-width="1.6"></rect>
    <text x="106" y="362" class="t" font-size="12" font-weight="700" fill="#6b6558" text-anchor="middle">NHÁNH A</text>
    <text x="106" y="384" class="t" font-size="13.5" font-weight="600" fill="#16150f" text-anchor="middle">ESP32 VIN</text>
    <line x1="52" y1="396" x2="160" y2="396" stroke="#e6e2db" stroke-width="1"></line>
    <text x="106" y="416" class="m" font-size="12" fill="#a01b1b" text-anchor="middle">+ C2 1000 µF</text>
    <text x="106" y="433" class="t" font-size="11" fill="#6b6558" text-anchor="middle">sát chân VIN</text>

    <!-- nhanh B -->
    <line x1="281" y1="300" x2="281" y2="334" stroke="#d92b2b" stroke-width="3" marker-end="url(#ar2)"></line>
    <rect x="211" y="340" width="140" height="112" rx="6" fill="#ffffff" stroke="#16150f" stroke-width="1.6"></rect>
    <text x="281" y="362" class="t" font-size="12" font-weight="700" fill="#6b6558" text-anchor="middle">NHÁNH B</text>
    <text x="281" y="384" class="t" font-size="13.5" font-weight="600" fill="#16150f" text-anchor="middle">HC-SR04 VCC</text>
    <line x1="227" y1="396" x2="335" y2="396" stroke="#e6e2db" stroke-width="1"></line>
    <text x="281" y="416" class="m" font-size="12" fill="#a01b1b" text-anchor="middle">+ C4 100 nF</text>
    <text x="281" y="433" class="t" font-size="11" fill="#6b6558" text-anchor="middle">tại chân cảm biến</text>

    <!-- nhanh C -->
    <line x1="456" y1="300" x2="456" y2="334" stroke="#d92b2b" stroke-width="3" marker-end="url(#ar2)"></line>
    <rect x="386" y="340" width="140" height="112" rx="6" fill="#ffffff" stroke="#16150f" stroke-width="1.6"></rect>
    <text x="456" y="362" class="t" font-size="12" font-weight="700" fill="#6b6558" text-anchor="middle">NHÁNH C</text>
    <text x="456" y="384" class="t" font-size="13" font-weight="600" fill="#16150f" text-anchor="middle">HAI cảm biến</text>
    <line x1="402" y1="396" x2="510" y2="396" stroke="#e6e2db" stroke-width="1"></line>
    <text x="456" y="416" class="m" font-size="12" fill="#a01b1b" text-anchor="middle">+ C5 100 nF</text>
    <text x="456" y="433" class="t" font-size="11" fill="#6b6558" text-anchor="middle">lưu lượng vào và ra</text>

    <!-- nhanh D -->
    <line x1="631" y1="300" x2="631" y2="334" stroke="#d92b2b" stroke-width="3" marker-end="url(#ar2)"></line>
    <rect x="561" y="340" width="140" height="112" rx="6" fill="#ffffff" stroke="#16150f" stroke-width="1.6"></rect>
    <text x="631" y="362" class="t" font-size="12" font-weight="700" fill="#6b6558" text-anchor="middle">NHÁNH D</text>
    <text x="631" y="384" class="t" font-size="13.5" font-weight="600" fill="#16150f" text-anchor="middle">ACS712 VCC</text>
    <line x1="577" y1="396" x2="685" y2="396" stroke="#e6e2db" stroke-width="1"></line>
    <text x="631" y="416" class="m" font-size="12" fill="#a01b1b" text-anchor="middle">+ C6 100 nF</text>
    <text x="631" y="433" class="t" font-size="11" fill="#6b6558" text-anchor="middle">chỉ chân nguồn</text>

    <!-- nhanh E -->
    <line x1="806" y1="300" x2="806" y2="334" stroke="#e8730c" stroke-width="5" marker-end="url(#ar2)"></line>
    <rect x="726" y="340" width="140" height="112" rx="6" fill="#fff3e8" stroke="#e8730c" stroke-width="2.2"></rect>
    <text x="796" y="362" class="t" font-size="12" font-weight="700" fill="#b8560a" text-anchor="middle">NHÁNH E · BẨN</text>
    <text x="796" y="384" class="t" font-size="13.5" font-weight="600" fill="#16150f" text-anchor="middle">Rơ le + bơm</text>
    <line x1="742" y1="396" x2="850" y2="396" stroke="#f3c9a4" stroke-width="1"></line>
    <text x="796" y="416" class="m" font-size="12" fill="#b8560a" text-anchor="middle">+ C3 470 µF</text>
    <text x="796" y="433" class="m" font-size="11.5" font-weight="600" fill="#b8560a" text-anchor="middle">dây ≥ 20 AWG</text>

    <!-- giai thich -->
    <rect x="36" y="480" width="828" height="80" rx="6" fill="#f4f1ea" stroke="#cfc8ba" stroke-width="1.5"></rect>
    <text x="56" y="506" class="t" font-size="14" font-weight="700" fill="#16150f">Vì sao phải hình sao</text>
    <text x="56" y="528" class="t" font-size="12.5" fill="#3a3529">Nhánh E mang dòng động cơ. Bốn nhánh còn lại là nhánh sạch. Chúng chỉ gặp nhau tại cọc buck,</text>
    <text x="56" y="548" class="t" font-size="12.5" fill="#3a3529">nên sụt áp và nhiễu do động cơ sinh ra không truyền sang đường dây nuôi ESP32.</text>

    <!-- dat -->
    <text x="36" y="600" class="t" font-size="14" font-weight="700" fill="#16150f">Đất cũng đi hình sao</text>
    <rect x="36" y="616" width="828" height="76" rx="6" fill="#ffffff" stroke="#16150f" stroke-width="1.8"></rect>
    <circle cx="450" cy="654" r="9" fill="#16150f"></circle>
    <text x="450" y="682" class="t" font-size="11.5" fill="#6b6558" text-anchor="middle">cọc âm của buck</text>
    <line x1="90" y1="654" x2="441" y2="654" stroke="#16150f" stroke-width="2.6"></line>
    <line x1="459" y1="654" x2="810" y2="654" stroke="#16150f" stroke-width="2.6"></line>
    <text x="90" y="644" class="t" font-size="11.5" fill="#3a3529">ESP32 · cảm biến · nút · phao</text>
    <text x="810" y="644" class="t" font-size="11.5" fill="#3a3529" text-anchor="end">bơm · rơ le</text>
    <text x="450" y="632" class="m" font-size="12" font-weight="600" fill="#a01b1b" text-anchor="middle">GND bơm KHÔNG đi chung dây với GND ESP32</text>

    <!-- khong dung buck 3v3 -->
    <rect x="36" y="712" width="828" height="80" rx="6" fill="#fdecec" stroke="#d92b2b" stroke-width="2"></rect>
    <text x="56" y="738" class="t" font-size="14" font-weight="700" fill="#a01b1b">Mạch buck 12 V → 3,3 V: không dùng</text>
    <text x="56" y="760" class="t" font-size="12.5" fill="#7d1616">Cấp vào chân 3V3 là đi vòng qua ổn áp trên bo. Mỗi lần cắm USB nạp chương trình, cổng USB cũng đẩy</text>
    <text x="56" y="780" class="t" font-size="12.5" fill="#7d1616">3,3 V qua ổn áp đó và hai nguồn đánh nhau. Bạn sẽ phải rút dây ra trước mỗi lần nạp.</text>
  </svg>
</div>
</x-dc>
</body>
</html>
